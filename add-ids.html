<!DOCTYPE html>
<html>
<head>
    <title>ATPL Question ID Generator</title>
</head>

<body>

<h2>ATPL Question ID Generator</h2>

<p>
This tool adds permanent IDs to your question JSON files.
</p>

<input type="file" id="fileInput" multiple accept=".json">

<br><br>

<button id="processBtn">
    Add Question IDs
</button>

<pre id="output"></pre>


<script>

document.getElementById("processBtn").onclick =
async function(){

    const files =
        document.getElementById("fileInput").files;

    const output =
        document.getElementById("output");


    if(!files.length){

        output.textContent =
            "Please select your JSON files first.";

        return;

    }


    output.textContent = "";


    for(const file of files){

        try{

            const text =
                await file.text();


            const questions =
                JSON.parse(text);


            let subject =
                file.name
                    .replace(".json","")
                    .toLowerCase();


            questions.forEach(
                function(question,index){

                    question.id =
                        subject +
                        "-" +
                        String(index + 1)
                            .padStart(4,"0");

                }
            );


            const newJson =
                JSON.stringify(
                    questions,
                    null,
                    4
                );


            const blob =
                new Blob(
                    [newJson],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                file.name;


            link.textContent =
                "Download " +
                file.name;


            link.style.display =
                "block";


            link.style.marginTop =
                "10px";


            output.appendChild(link);


            const message =
                document.createElement("div");


            message.textContent =
                "Processed " +
                file.name +
                " — " +
                questions.length +
                " questions";


            output.insertBefore(
                message,
                link
            );


        }catch(error){

            output.textContent +=
                "\nERROR: " +
                file.name +
                "\n" +
                error.message;

        }

    }

};

</script>

</body>
</html>
